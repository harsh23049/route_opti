name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build & test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
          - { os: windows-latest, node: 24 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Build C++ engine
        run: >
          cmake -S algorithms -B algorithms/build -DCMAKE_BUILD_TYPE=Release
          -DROUTE_OPTI_WERROR=${{ runner.os == 'Linux' && 'ON' || 'OFF' }}
          && cmake --build algorithms/build --config Release --parallel
      - name: Test (C++ + backend API + end-to-end)
        run: npm test
      - name: Build frontend
        run: npm run build:frontend

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint

  sanitizers:
    name: C++ tests under ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: cmake -S algorithms -B build-asan -DCMAKE_BUILD_TYPE=Debug -DROUTE_OPTI_SANITIZE=ON -DROUTE_OPTI_WERROR=ON
      - run: cmake --build build-asan --parallel
      - run: ctest --test-dir build-asan --output-on-failure

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t route-opti .
      - run: docker run -d --name route-opti -p 8080:8080 route-opti
      - name: Health check and sample optimization
        run: |
          for i in $(seq 1 30); do curl -fs http://localhost:8080/api/health && break; sleep 1; done
          curl -fs -X POST http://localhost:8080/api/optimize \
            -H 'Content-Type: application/json' --data @data/sample-input.json | grep -q '"success":true'
          curl -fs http://localhost:8080/ | grep -q '<div id="root">'
      - if: failure()
        run: docker logs route-opti
